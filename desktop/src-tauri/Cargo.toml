[package]
name = "voicetype"
version = "2.0.0"
description = "音转文 - 声音转文字（完全离线）"
authors = ["音转文"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "voicetype_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 导出 TXT / HTML 要用原生「另存为」对话框：
# WebView 里的 <a download> 在桌面端不可靠，iOS 上更是完全不可用。
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
